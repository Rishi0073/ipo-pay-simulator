name: ipo_pay_simulator
description: A Flutter simulator for IPO two-phase payments (UPI ASBA block, then debit on allotment or unblock). Learn how IPO money really moves.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
